# Local development only. Production uses Neon PostgreSQL (see README).
x-api-env: &api-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: hardwhere
  DB_USERNAME: hardwhere
  DB_PASSWORD: hardwhere_dev_only
  # Every outgoing email (demand alerts, invites, password resets) lands in Mailpit, never on the internet.
  MAIL_MAILER: smtp
  MAIL_SCHEME: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: demand@hardwhere.test
  MAIL_FROM_NAME: HardWhere

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hardwhere
      POSTGRES_PASSWORD: hardwhere_dev_only
      POSTGRES_DB: hardwhere
    ports: ["5455:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardwhere"]
      interval: 3s
      retries: 20
  # Local inbox: SMTP on 1025 for the containers, web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports: ["8025:8025", "1025:1025"]
  api:
    build: ./docker/php
    working_dir: /app
    # ./packages is mounted so the contract tests can write JSON fixtures that the mobile apps type-check against
    volumes: ["./api:/app", "./packages:/packages"]
    environment:
      <<: *api-env
      PHP_CLI_SERVER_WORKERS: "8"
    # Not `artisan serve`: it strips env vars that also appear in .env, which would silently switch the DB back to SQLite.
    command: ["sh", "-c", "cd public && exec php -S 0.0.0.0:8787 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]
    ports: ["8787:8787"]
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
  # Runs routes/console.php schedules, including demand:detect.
  scheduler:
    build: ./docker/php
    working_dir: /app
    volumes: ["./api:/app"]
    environment: *api-env
    command: php artisan schedule:work
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
volumes:
  pgdata:
