# Local development only. Production uses Neon PostgreSQL (see README).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hardwhere
      POSTGRES_PASSWORD: hardwhere_dev_only
      POSTGRES_DB: hardwhere
    ports: ["5455:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardwhere"]
      interval: 3s
      retries: 20
  api:
    build: ./docker/php
    working_dir: /app
    volumes: ["./api:/app"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: hardwhere
      DB_USERNAME: hardwhere
      DB_PASSWORD: hardwhere_dev_only
      PHP_CLI_SERVER_WORKERS: "8"
    command: php artisan serve --host=0.0.0.0 --port=8787
    ports: ["8787:8787"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pgdata:
